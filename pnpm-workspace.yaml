cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - 'ua-parser-js@1.0.41 || 0.7.41' # React Native Web & Expo Devices; UAP v2 is not MIT
  - 'chokidar@4.0.3' # Angular via Sass. See https://github.com/angular/angular-cli/pull/33235#issuecomment-4546209387
  - 'semver@6.3.1 || 5.7.2' # Angular Devkit
  - 'hosted-git-info@6.1.3' # Remix Run Dev
  - 'vite@5.4.21' # Remix Run Dev
  - 'react-native-worklets@0.5.1' # Expo 56 fixes this but is too new; upgrade in a few days
  - 'eslint-import-resolver-typescript@3.10.1' # Same as above

# Too young to use currently, upgrade in a few days
overrides: { 'tinyexec': '1.1.2' }

# Solid 2 transition (remove at Solid 2 GA): @solidjs/testing-library@1.0.0-beta.2
# declares `>=2.0.0` peers, and semver only admits a prerelease into a range when
# some comparator in that range shares its [major,minor,patch] tuple — so `>=2.0.0`
# does not match `2.0.0-beta.30` and pnpm reports two unmet peers.
#
# This is cosmetic only: pnpm still links the single Solid 2 copy it has, verified
# by the peer-suffixed store directory
# `@solidjs+testing-library@1.0.0-beta.2_@solidjs+web@2.0.0-beta.30_solid-js@2.0.0-beta.30__solid-js@2.0.0-beta.30`.
# So this silences a warning; it does not steer resolution.
#
# NOT packageExtensions: pnpm's packageExtensions are purely additive and cannot
# replace a peer range that the published manifest already declares — measured,
# an extension adds new keys but leaves `solid-js: '>=2.0.0'` untouched.
peerDependencyRules:
  allowedVersions:
    '@solidjs/testing-library>solid-js': '>=2.0.0-0 <3.0.0'
    '@solidjs/testing-library>@solidjs/web': '>=2.0.0-0 <3.0.0'

packages:
  - packages/**
  - examples/angular/**
  - examples/react/**
  - examples/preact/**
  - examples/solid/**
  # Parked for the Solid 2 transition: this example depends on
  # @tanstack/solid-form-devtools -> @tanstack/form-devtools, both Solid 1 source
  # with no Solid 2 line upstream, and vite-plugin-solid@3 enforces a single Solid
  # runtime by design. Source and docs stay in-tree — see the example's README.
  - '!examples/solid/devtools'
  - examples/vue/**
  - examples/lit/**
  - examples/svelte/**

allowBuilds:
  # root dependency
  nx: true
  unrs-resolver: false # not directly required for build
  esbuild: true

  # nx, @vitejs/plugin-react-swc, terser-webpack-plugin
  '@swc/core': true

  # @angular/build
  '@parcel/watcher': false # optional dep of @angular/build
  lmdb: false # optional dep of @angular/build
  msgpackr-extract: false # optional dep of @angular/build

  # @tanstack/vue-store
  vue-demi: false # only required for vue 2 support

  # nextJs
  sharp: false # not directly required for build
